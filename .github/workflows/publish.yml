name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          LATEST="${LATEST#v}"
          VERSION="$(node -e 'const [a,b,c]=(process.argv[1]||"0.0.0").split(".").map(Number);const t=process.argv[2];console.log(t==="major"?`${a+1}.0.0`:t==="minor"?`${a}.${b+1}.0`:`${a}.${b}.${c+1}`)' "$LATEST" "$BUMP")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # the macOS Touch ID helper needs swiftc, so it is built on a Mac and embedded in both darwin builds
  auth:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/build-auth.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dokky-auth
          path: cli/internal/sysauth/dokkyauth/dokky-auth
          if-no-files-found: error

  build:
    needs: [version, auth]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('cli/go.sum') }}
          restore-keys: go-${{ matrix.goos }}-${{ matrix.goarch }}-

      - if: matrix.goos == 'darwin'
        uses: actions/download-artifact@v7
        with:
          name: dokky-auth
          path: cli/internal/sysauth/dokkyauth

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: cli
        run: |
          EXT=""; TAGS=""
          if [ "$GOOS" = windows ]; then EXT=".exe"; TAGS="cmount"; fi
          if [ "$GOOS" = darwin ] && [ ! -s internal/sysauth/dokkyauth/dokky-auth ]; then echo "::error::the Touch ID helper is missing"; exit 1; fi
          OVERLAY=$(GOOS= GOARCH= GOFLAGS= go run _patches/overlay.go)
          go build -trimpath "$OVERLAY" -tags "$TAGS" \
            -ldflags "-s -w -X github.com/itzzritik/dokky/cli/internal/buildinfo.Version=$VERSION" \
            -o "../dokky-$GOOS-$GOARCH$EXT" ./cmd/dokky

      # one stable certificate, so macOS keeps granted permissions across updates
      - name: Sign
        if: matrix.goos == 'darwin'
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "::warning::MACOS_SIGN_P12 is not set, darwin builds stay ad-hoc signed"; exit 0; }
          curl -fsSL -o rcodesign.tgz https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  rcodesign.tgz" | sha256sum -c
          tar xzf rcodesign.tgz --strip-components=1 -C "$RUNNER_TEMP"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/sign.p12"
          printf %s "$P12_PASSWORD" > "$RUNNER_TEMP/sign.pw"
          "$RUNNER_TEMP/rcodesign" sign --p12-file "$RUNNER_TEMP/sign.p12" --p12-password-file "$RUNNER_TEMP/sign.pw" \
            --binary-identifier me.ritik.dokky "dokky-$GOOS-$GOARCH"
          rm -f rcodesign.tgz "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/sign.pw"

      - uses: actions/upload-artifact@v7
        with:
          name: dokky-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dokky-*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dokky-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum dokky-* > checksums.txt

      - name: GitHub release
        run: gh release create "$TAG" dist/dokky-* dist/checksums.txt --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - run: node scripts/write-hashes.mjs "$VERSION" dist

      - run: npm publish --provenance --access public ./npm
