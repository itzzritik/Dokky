name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          LATEST="${LATEST#v}"
          VERSION="$(node -e 'const [a,b,c]=(process.argv[1]||"0.0.0").split(".").map(Number);const t=process.argv[2];console.log(t==="major"?`${a+1}.0.0`:t==="minor"?`${a}.${b+1}.0`:`${a}.${b}.${c+1}`)' "$LATEST" "$BUMP")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('cli/go.sum') }}
          restore-keys: go-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: cli
        run: |
          EXT=""; TAGS=""
          if [ "$GOOS" = windows ]; then EXT=".exe"; TAGS="cmount"; fi
          go build -trimpath -tags "$TAGS" \
            -ldflags "-s -w -X github.com/itzzritik/dokky/cli/internal/buildinfo.Version=$VERSION" \
            -o "../dokky-$GOOS-$GOARCH$EXT" ./cmd/dokky

      - uses: actions/upload-artifact@v7
        with:
          name: dokky-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dokky-*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dokky-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum dokky-* > checksums.txt

      - name: GitHub release
        run: gh release create "$TAG" dist/dokky-* dist/checksums.txt --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - run: node scripts/write-hashes.mjs "$VERSION" dist

      - run: npm publish --provenance --access public ./npm
