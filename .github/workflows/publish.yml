name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          TAG="$(npm version "$BUMP" --prefix npm --no-git-tag-version)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checks
        run: |
          cd cli
          go vet ./...
          go test ./...

      - name: Tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "publish $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --follow-tags origin HEAD:main

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: node scripts/write-hashes.mjs "${{ steps.version.outputs.version }}" dist

      - run: npm publish --provenance --access public ./npm

      - env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git commit -am "release $TAG binaries"
          git push origin HEAD:main
