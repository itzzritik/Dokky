name: CI

on:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    env:
      GOFLAGS: ${{ matrix.os == 'windows-latest' && '-tags=cmount' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
      - run: go test ./...

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tags: e2e
          - os: ubuntu-latest
            tags: e2e
          - os: windows-latest
            tags: e2e cmount
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y fuse3
      - if: matrix.os == 'windows-latest'
        run: choco install winfsp -y
      - run: go test -tags "${{ matrix.tags }}" ./e2e -count=1 -timeout 30m

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: cli

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
        working-directory: npm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx next typegen
      - run: bunx tsc --noEmit
      - run: bun test
